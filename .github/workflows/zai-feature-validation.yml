name: Z.ai Feature Validation

# Preview validation is intentionally opt-in. Do not trigger a build on every
# source commit, and do not let CI modify the feature branch.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/zai-quota-taskbar

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust in temporary CI workspace
        run: cargo fmt --all
      - name: Run unit tests
        run: cargo test --all-targets --locked
      - name: Build Windows executable
        run: cargo build --release --locked
      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-zai-windows-preview
          path: target/release/codex-usage.exe
          if-no-files-found: error
