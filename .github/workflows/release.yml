name: Release Z.ai Portable Preview

on:
  push:
    tags:
      - 'v*-zai.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build portable executable
        run: cargo build --release --locked

      - name: Prepare portable release and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/codex-usage.exe dist/codex-usage.exe
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-usage.exe).Hash.ToLowerInvariant()
          "$hash  codex-usage.exe" | Set-Content -Encoding ascii dist/codex-usage.exe.sha256

      - name: Publish Z.ai preview release
        uses: softprops/action-gh-release@v2
        with:
          name: Codex Usage + Z.ai ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          body: |
            Portable Windows preview of the A-Denana Z.ai fork.
            Displays Codex and Z.ai Coding Plan quotas side by side in the taskbar.
            Download the EXE and its SHA256 checksum. Do not overwrite the upstream-installed app.
            ZCode must be signed in locally for Z.ai quota access.
            The preview has independent settings and auto-updates disabled.
          files: |
            dist/codex-usage.exe
            dist/codex-usage.exe.sha256
