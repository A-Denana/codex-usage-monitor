name: Z.ai Feature Validation

on:
  push:
    branches:
      - feat/zai-quota-taskbar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Rust formatting in runner
        run: cargo fmt --all
      - name: Run unit tests
        run: cargo test --all-targets
      - name: Build Windows executable
        run: cargo build --release
      - name: Save validated formatting and lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src Cargo.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "style: rustfmt Z.ai integration and sync lockfile"
            git push origin HEAD:feat/zai-quota-taskbar
          }
      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-zai-windows-preview
          path: target/release/codex-usage.exe
          if-no-files-found: error
